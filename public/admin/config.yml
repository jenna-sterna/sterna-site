          - { label: "List lead emphasis (Portuguese)", name: "listExp_leadEmph_pt", widget: "string" }
          - { label: "List CTA — all experiences (English)", name: "listExp_ctaAll_en", widget: "string" }
          - { label: "List CTA — all experiences (Portuguese)", name: "listExp_ctaAll_pt", widget: "string" }

          # Why list
          - { label: "Why eyebrow (English)", name: "whyList_eyebrow_en", widget: "string" }
          - { label: "Why eyebrow (Portuguese)", name: "whyList_eyebrow_pt", widget: "string" }
