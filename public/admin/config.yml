# Sveltia CMS configuration for Sterna Aveiro Experiences
#
# Uses GitHub OAuth via a Cloudflare Worker (sveltia-cms-auth).
# Editors must be collaborators on Bduncs2/sterna-site.
#
# For local development, run `npx @sveltia/cms-proxy-server` in a second
# terminal and open http://localhost:4321/admin/ — writes to disk directly.

backend:
  name: github
  repo: Bduncs2/sterna-site
  branch: main
  base_url: https://sveltia-cms-auth.braidenduncan1.workers.dev

local_backend: true

media_folder: "public/uploads"
public_folder: "/uploads"

site_url: https://sterna.pt
display_url: https://sterna.pt
logo_url: /favicon.svg

collections:

  # ==========================================================
  # 1. EXPERIENCES  (unchanged — this is the model)
  # ==========================================================
  - name: "experiences"
    label: "Experiences"
    label_singular: "Experience"
    description: "The 9 tours you offer. Edit any field, or click 'New Experience' to add a whole new tour."
    folder: "src/content/experiences"
    format: "yaml-frontmatter"
    create: true
    slug: "{{slug}}"
    identifier_field: nameEn
    summary: "{{nameEn}} — {{durationEn}}"
    sortable_fields: ["order", "featured", "nameEn"]
    fields:
      - { label: "URL slug (no spaces, lowercase, dashes only)", name: "slug", widget: "string", hint: "Used in the page URL. Do not change once published." }
      - { label: "Display order", name: "order", widget: "number", value_type: "int", min: 1, hint: "Lower numbers appear first." }
      - { label: "Featured on homepage?", name: "featured", widget: "boolean", default: false, hint: "If yes, this experience appears in the homepage 'core 6' section." }
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - { label: "Nature & water", value: "nature" }
          - { label: "Food & wine", value: "food" }
          - { label: "Nature & culture", value: "culture" }
          - { label: "Wellness", value: "wellness" }
          - { label: "Beach & coast", value: "beach" }
      - { label: "Category label (English)", name: "categoryLabelEn", widget: "string", hint: "Shown as a small tag on cards, e.g. 'Food & Wine'." }
      - { label: "Category label (Portuguese)", name: "categoryLabelPt", widget: "string" }
      - { label: "Name (English)", name: "nameEn", widget: "string", hint: "Full title of the experience." }
      - { label: "Name (Portuguese)", name: "namePt", widget: "string" }
      - { label: "Short tagline (English)", name: "shortEn", widget: "string", hint: "One short line shown on cards." }
      - { label: "Short tagline (Portuguese)", name: "shortPt", widget: "string" }
      - { label: "One-liner description (English)", name: "oneLinerEn", widget: "text", hint: "One or two sentences summarising the day." }
      - { label: "One-liner description (Portuguese)", name: "oneLinerPt", widget: "text" }
      - { label: "Duration (English)", name: "durationEn", widget: "string", hint: "e.g. '4 hours', '5-6 hours', 'Half day'." }
      - { label: "Duration (Portuguese)", name: "durationPt", widget: "string" }

      - label: "What's included (English)"
        name: "includedEn"
        widget: "list"
        field: { label: "Item", name: "item", widget: "string" }
      - label: "What's included (Portuguese)"
        name: "includedPt"
        widget: "list"
        field: { label: "Item", name: "item", widget: "string" }

      - label: "Optional add-ons (English)"
        name: "addOnsEn"
        widget: "list"
        required: false
        field: { label: "Item", name: "item", widget: "string" }
      - label: "Optional add-ons (Portuguese)"
        name: "addOnsPt"
        widget: "list"
        required: false
        field: { label: "Item", name: "item", widget: "string" }

      - { label: "Price note (English)", name: "priceNoteEn", widget: "text", hint: "How pricing works, e.g. 'Custom quote per group.'" }
      - { label: "Price note (Portuguese)", name: "priceNotePt", widget: "text" }

      - label: "Press feature — Source"
        name: "pressSource"
        widget: "string"
        required: false
        hint: "e.g. 'Travel + Leisure'. Leave blank if this experience hasn't been featured in press."
      - { label: "Press feature — URL to article", name: "pressUrl", widget: "string", required: false }
      - { label: "Press feature — Quote (English)", name: "pressQuoteEn", widget: "text", required: false }
      - { label: "Press feature — Quote (Portuguese)", name: "pressQuotePt", widget: "text", required: false }

      - { label: "Main photo", name: "heroPhoto", widget: "image", required: false, hint: "Landscape photo, 2000-3000px wide. Upload or pick from library." }
      - label: "Gallery (extra photos)"
        name: "gallery"
        widget: "list"
        required: false
        field: { label: "Photo", name: "photo", widget: "image" }

  # ==========================================================
  # 2. FOUNDERS
  # ==========================================================
  - name: "founders"
    label: "Team members"
    label_singular: "Team member"
    description: "Photos, names, and bios shown on the About page and homepage founder section."
    folder: "src/content/founders"
    format: "yaml-frontmatter"
    create: true
    slug: "{{slug}}"
    identifier_field: nameEn
    summary: "{{nameEn}} — {{roleEn}}"
    sortable_fields: ["order", "nameEn"]
    fields:
      - { label: "Display order", name: "order", widget: "number", value_type: "int", min: 1, hint: "Lower numbers appear first (left to right on the page)." }
      - { label: "URL slug (lowercase, no spaces)", name: "slug", widget: "string", hint: "e.g. 'jenna', 'carlos'. Do not change once set." }
      - { label: "Name", name: "nameEn", widget: "string", hint: "First name as shown on the site." }
      - { label: "Name (Portuguese, only if different)", name: "namePt", widget: "string", required: false }
      - { label: "Role — English", name: "roleEn", widget: "string", hint: "e.g. 'Concierge & Guide', 'Master Guide'. Shown under the name." }
      - { label: "Role — Portuguese", name: "rolePt", widget: "string" }
      - { label: "Origin line — English", name: "originEn", widget: "string", hint: "One short line, e.g. 'USA → Aveiro, 2025' or 'Aveiro, born & raised · 52 years'." }
      - { label: "Origin line — Portuguese", name: "originPt", widget: "string" }
      - { label: "Bio — English", name: "lineEn", widget: "text", hint: "2-3 sentence introduction. Shown on the About page under this person's photo." }
      - { label: "Bio — Portuguese", name: "linePt", widget: "text" }
      - { label: "Photo", name: "photo", widget: "image", required: false, hint: "Portrait photo, roughly square or vertical. iPhone photos work well." }

  # ==========================================================
  # 3. FAQs
  # ==========================================================
  - name: "faqs"
    label: "Frequently asked questions"
    label_singular: "FAQ"
    description: "Questions and answers shown on the /faq/ page. Add, edit, remove, or reorder."
    folder: "src/content/faqs"
    format: "yaml-frontmatter"
    create: true
    slug: "{{order}}-{{slug}}"
    identifier_field: questionEn
    summary: "{{order}} · {{questionEn}}"
    sortable_fields: ["order", "questionEn"]
    fields:
      - { label: "Display order", name: "order", widget: "number", value_type: "int", min: 1, hint: "Lower numbers appear first." }
      - { label: "Question — English", name: "questionEn", widget: "string" }
      - { label: "Question — Portuguese", name: "questionPt", widget: "string" }
      - { label: "Answer — English", name: "answerEn", widget: "markdown", hint: "You can use **bold**, *italic*, and links." }
      - { label: "Answer — Portuguese", name: "answerPt", widget: "markdown" }

  # ==========================================================
  # 4. REVIEWS
  # ==========================================================
  - name: "reviews"
    label: "TripAdvisor reviews"
    label_singular: "Review"
    description: "Real reviews shown on the homepage. Add new ones as they come in on TripAdvisor / Google."
    folder: "src/content/reviews"
    format: "yaml-frontmatter"
    create: true
    slug: "{{order}}-{{slug}}"
    identifier_field: authorName
    summary: "{{order}} · {{authorName}}"
    sortable_fields: ["order", "authorName"]
    fields:
      - { label: "Display order", name: "order", widget: "number", value_type: "int", min: 1, hint: "Lower numbers appear first." }
      - { label: "Reviewer name", name: "authorName", widget: "string", hint: "Their display name on TripAdvisor / Google." }
      - { label: "City and/or date", name: "authorMeta", widget: "string", hint: "e.g. 'London, UK · September 2025' or just 'September 2025'." }
      - { label: "Star rating", name: "rating", widget: "number", value_type: "int", min: 1, max: 5, default: 5, hint: "1 to 5. Almost always 5." }
      - { label: "Quote — English", name: "quoteEn", widget: "text", hint: "The review text (English version)." }
      - { label: "Quote — Portuguese", name: "quotePt", widget: "text", hint: "Portuguese translation. Optional — if left blank, English is shown." }

  # ==========================================================
  # 5. CONTACT INFO (single file — phone, WhatsApp, email, socials)
  # ==========================================================
  - name: "contact_info"
    label: "Contact info"
    description: "Your phone, WhatsApp, email, Instagram, TripAdvisor. Used everywhere on the site."
    editor: { preview: false }
    files:
      - name: "company"
        label: "Contact & business info"
        file: "src/content/settings/company.yml"
        delete: false
        create: false
        fields:
          - { label: "Business name", name: "name", widget: "string", hint: "e.g. 'Sterna Aveiro Experiences'. Shown in the footer and browser tabs." }
          - { label: "Short name", name: "shortName", widget: "string", hint: "Just 'Sterna'. Used in casual references." }
          - { label: "Phone number (displayed)", name: "phone", widget: "string", hint: "How it looks on the page, e.g. '+1 650 847 8614'." }
          - { label: "Phone number (link, tel: format)", name: "phoneHref", widget: "string", hint: "For clickable phone links. Format: 'tel:+16508478614' (no spaces, includes country code)." }
          - { label: "WhatsApp number (displayed)", name: "whatsapp", widget: "string", hint: "How it looks on the page." }
          - { label: "WhatsApp link", name: "whatsappHref", widget: "string", hint: "Format: 'https://wa.me/16508478614' (no plus sign, just digits)." }
          - { label: "Email address (displayed)", name: "email", widget: "string" }
          - { label: "Email link", name: "emailHref", widget: "string", hint: "Format: 'mailto:info@sterna.pt'." }
          - { label: "Instagram handle", name: "instagramHandle", widget: "string", hint: "e.g. '@sternaaveirotours'." }
          - { label: "Instagram URL", name: "instagramUrl", widget: "string", hint: "Full URL to your Instagram profile." }
          - { label: "TripAdvisor URL", name: "tripadvisorUrl", widget: "string", hint: "Full URL to your TripAdvisor listing." }
          - { label: "Total review count (displayed)", name: "reviewCount", widget: "string", hint: "e.g. '300+'. Shown in trust badges and homepage." }
          - { label: "Year founded", name: "established", widget: "number", value_type: "int", hint: "Just the year, e.g. 2010." }
          - { label: "City", name: "addressCity", widget: "string", hint: "e.g. 'Aveiro'." }
          - { label: "Region", name: "addressRegion", widget: "string", hint: "e.g. 'Centro'." }
          - { label: "Country", name: "addressCountry", widget: "string", hint: "e.g. 'Portugal'." }
          - { label: "Maximum group size", name: "maxGroupSize", widget: "number", value_type: "int", hint: "The largest standard tour group, e.g. 8." }

      - name: "trust"
        label: "Trust badges (small chips)"
        file: "src/content/settings/trust.yml"
        delete: false
        create: false
        fields:
          - label: "Badges"
            name: "badges"
            widget: "list"
            summary: "{{fields.en}}"
            hint: "Small tags shown in the footer and various trust sections, e.g. 'Licensed & insured'."
            fields:
              - { label: "Badge — English", name: "en", widget: "string" }
              - { label: "Badge — Portuguese", name: "pt", widget: "string" }

  # ==========================================================
  # 6. HOMEPAGE  (grouped by section, plain-English labels + hints)
  # ==========================================================
  - name: "homepage"
    label: "Homepage"
    description: "All the text on the main / homepage. Grouped by section — click a section to expand."
    editor: { preview: false }
    files:
      - name: "home"
        label: "Homepage sections"
        file: "src/content/pages/home.yml"
        delete: false
        create: false
        fields:

          # ---- Hero ----
          - label: "1. Hero (top of page, over the canal photo)"
            name: "hero"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Small text above headline — English", name: "hero_eyebrow_en", widget: "string", hint: "e.g. 'Aveiro · Portugal'. Small gold text above the big headline." }
              - { label: "Small text above headline — Portuguese", name: "hero_eyebrow_pt", widget: "string" }
              - { label: "Headline, line 1 — English", name: "hero_line1_en", widget: "string", hint: "First line of the huge title. e.g. 'Aveiro,'." }
              - { label: "Headline, line 1 — Portuguese", name: "hero_line1_pt", widget: "string" }
              - { label: "Headline, line 2 — English", name: "hero_line2_en", widget: "string", hint: "Second line. e.g. 'uncovered.'." }
              - { label: "Headline, line 2 — Portuguese", name: "hero_line2_pt", widget: "string" }
              - { label: "Headline, line 3 (italic, gold) — English", name: "hero_line3_en", widget: "string", hint: "Third line, shown in italic gold. e.g. 'With local friends.'." }
              - { label: "Headline, line 3 (italic, gold) — Portuguese", name: "hero_line3_pt", widget: "string" }
              - { label: "Intro paragraph — English", name: "hero_lead_en", widget: "text", hint: "The 'We're Jenna, Carlos & Sandra...' paragraph below the headline." }
              - { label: "Intro paragraph — Portuguese", name: "hero_lead_pt", widget: "text" }
              - { label: "Primary button label — English", name: "hero_ctaPrimary_en", widget: "string", hint: "Big teal button, e.g. 'See the experiences'." }
              - { label: "Primary button label — Portuguese", name: "hero_ctaPrimary_pt", widget: "string" }
              - { label: "Secondary button label — English", name: "hero_ctaSecondary_en", widget: "string", hint: "Ghost button next to the primary, e.g. 'WhatsApp us'." }
              - { label: "Secondary button label — Portuguese", name: "hero_ctaSecondary_pt", widget: "string" }
              - { label: "Scroll indicator text — English", name: "hero_scroll_en", widget: "string", hint: "The tiny word next to the scroll line at the bottom of the hero." }
              - { label: "Scroll indicator text — Portuguese", name: "hero_scroll_pt", widget: "string" }
              # Trust prefix/number/suffix kept but tucked in (rarely edited)
              - { label: "Trust — number (e.g. '300+')", name: "hero_trustNumber_en", widget: "string", required: false }
              - { label: "Trust — number (Portuguese)", name: "hero_trustNumber_pt", widget: "string", required: false }
              - { label: "Trust — suffix — English", name: "hero_trustSuffix_en", widget: "string", required: false }
              - { label: "Trust — suffix — Portuguese", name: "hero_trustSuffix_pt", widget: "string", required: false }
              - { label: "Trust — prefix — English", name: "hero_trustPrefix_en", widget: "string", required: false }
              - { label: "Trust — prefix — Portuguese", name: "hero_trustPrefix_pt", widget: "string", required: false }

          # ---- Intro / note from us ----
          - label: "2. Intro (the 'note from the three of us' section, right after the hero)"
            name: "intro"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Small caption above the paragraph — English", name: "intro_caption_en", widget: "string", hint: "e.g. 'A note from the three of us'." }
              - { label: "Small caption above the paragraph — Portuguese", name: "intro_caption_pt", widget: "string" }
              - { label: "Main paragraph — English", name: "intro_body_en", widget: "text", hint: "The main body text of this section (with the drop-cap first letter)." }
              - { label: "Main paragraph — Portuguese", name: "intro_body_pt", widget: "text" }
              - { label: "Signature — English", name: "intro_sig_en", widget: "string", hint: "e.g. 'Jenna, Carlos & Sandra'. Handwritten style." }
              - { label: "Signature — Portuguese", name: "intro_sig_pt", widget: "string" }

          # ---- Featured salt-pans section ----
          - label: "3. Salt pans feature (big highlighted experience, section #01)"
            name: "featured"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Section number — English", name: "featured_number_en", widget: "string", hint: "e.g. '01'. The small number label above the section." }
              - { label: "Section number — Portuguese", name: "featured_number_pt", widget: "string" }
              - { label: "Small label — English", name: "featured_eyebrow_en", widget: "string", hint: "e.g. 'Our biggest one'." }
              - { label: "Small label — Portuguese", name: "featured_eyebrow_pt", widget: "string" }
              - { label: "Main headline line 1 — English", name: "featured_hookLine1_en", widget: "string", hint: "e.g. 'Walk the salt pans'." }
              - { label: "Main headline line 1 — Portuguese", name: "featured_hookLine1_pt", widget: "string" }
              - { label: "Main headline line 2 (italic) — English", name: "featured_hookLine2_en", widget: "string", hint: "e.g. 'with the oldest marnoto.'." }
              - { label: "Main headline line 2 (italic) — Portuguese", name: "featured_hookLine2_pt", widget: "string" }
              - { label: "Description paragraph — English", name: "featured_copyLead_en", widget: "text", hint: "Describes what makes this experience special." }
              - { label: "Description paragraph — Portuguese", name: "featured_copyLead_pt", widget: "text" }
              - { label: "Pull quote — English", name: "featured_pullQuote_en", widget: "text", hint: "Big quoted line, e.g. 'Some operators explain the salt pans. We take you to the man who owns them.'" }
              - { label: "Pull quote — Portuguese", name: "featured_pullQuote_pt", widget: "text" }
              - { label: "Photo annotation (hand-drawn arrow text) — English", name: "featured_annotation_en", widget: "string", hint: "The little handwritten note pointing at the photo, e.g. '← that's Senhor Álvaro, still working at 73'." }
              - { label: "Photo annotation (hand-drawn arrow text) — Portuguese", name: "featured_annotation_pt", widget: "string" }
              - { label: "Read-more link text — English", name: "featured_cta_en", widget: "string", hint: "e.g. 'Read the full experience'." }
              - { label: "Read-more link text — Portuguese", name: "featured_cta_pt", widget: "string" }

          # ---- Duo section ----
          - label: "4. Two more classics (the pair of experience cards after the salt pans)"
            name: "duo"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Small label above — English", name: "duo_eyebrow_en", widget: "string", hint: "e.g. 'Two more classics'." }
              - { label: "Small label above — Portuguese", name: "duo_eyebrow_pt", widget: "string" }
              - { label: "Left card kicker — English", name: "duo_w1Kicker_en", widget: "string", hint: "e.g. '02 · Food & wine'. Small tag above the left card." }
              - { label: "Left card kicker — Portuguese", name: "duo_w1Kicker_pt", widget: "string" }
              - { label: "Right card kicker — English", name: "duo_w2Kicker_en", widget: "string", hint: "e.g. '03 · Food & wine'." }
              - { label: "Right card kicker — Portuguese", name: "duo_w2Kicker_pt", widget: "string" }

          # ---- List of 3 more experiences ----
          - label: "5. Three more days worth planning (list of 3 numbered experiences)"
            name: "listExp"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Small label above — English", name: "listExp_eyebrow_en", widget: "string", hint: "e.g. 'Three more days worth planning'." }
              - { label: "Small label above — Portuguese", name: "listExp_eyebrow_pt", widget: "string" }
              - { label: "Intro paragraph, plain part — English", name: "listExp_leadPrefix_en", widget: "string", hint: "e.g. 'Bussaco, Vista Alegre, sunset on the boat.'." }
              - { label: "Intro paragraph, plain part — Portuguese", name: "listExp_leadPrefix_pt", widget: "string" }
              - { label: "Intro paragraph, italic emphasis — English", name: "listExp_leadEmph_en", widget: "string", hint: "e.g. 'Each one a full day in itself.' Shown italicized." }
              - { label: "Intro paragraph, italic emphasis — Portuguese", name: "listExp_leadEmph_pt", widget: "string" }
              - { label: "See-all-experiences button label — English", name: "listExp_ctaAll_en", widget: "string", hint: "e.g. 'See all nine experiences'." }
              - { label: "See-all-experiences button label — Portuguese", name: "listExp_ctaAll_pt", widget: "string" }

          # ---- Why (Aveiro isn't a day trip) ----
          - label: "6. What most tourists miss (the 'Aveiro isn't a day trip' section)"
            name: "why"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Small label — English", name: "whyList_eyebrow_en", widget: "string", hint: "e.g. 'What most tourists miss'." }
              - { label: "Small label — Portuguese", name: "whyList_eyebrow_pt", widget: "string" }
              - { label: "Big headline — English", name: "whyList_h2_en", widget: "string", hint: "e.g. \"Aveiro isn't a day trip.\"" }
              - { label: "Big headline — Portuguese", name: "whyList_h2_pt", widget: "string" }
              - { label: "Paragraph — English", name: "whyList_body_en", widget: "text" }
              - { label: "Paragraph — Portuguese", name: "whyList_body_pt", widget: "text" }
              - { label: "Handwritten ask — English", name: "whyList_ask_en", widget: "string", hint: "e.g. 'Ask us what to skip.' In the handwritten font." }
              - { label: "Handwritten ask — Portuguese", name: "whyList_ask_pt", widget: "string" }

          # ---- Proof (reviews section header) ----
          - label: "7. Reviews section header (above the review cards)"
            name: "proof"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Headline line 1 — English", name: "proof_h2Line1_en", widget: "string", hint: "e.g. 'Not our word.'" }
              - { label: "Headline line 1 — Portuguese", name: "proof_h2Line1_pt", widget: "string" }
              - { label: "Headline line 2 (italic) — English", name: "proof_h2Line2_en", widget: "string", hint: "e.g. 'Theirs, on TripAdvisor.'" }
              - { label: "Headline line 2 (italic) — Portuguese", name: "proof_h2Line2_pt", widget: "string" }
              - { label: "Intro paragraph — English", name: "proof_lead_en", widget: "text" }
              - { label: "Intro paragraph — Portuguese", name: "proof_lead_pt", widget: "text" }
              - { label: "Link to TripAdvisor button — English", name: "proof_cta_en", widget: "string", hint: "e.g. 'Read the reviews on TripAdvisor →'." }
              - { label: "Link to TripAdvisor button — Portuguese", name: "proof_cta_pt", widget: "string" }

          # ---- Founders teaser ----
          - label: "8. Meet the team teaser (short version, linking to About page)"
            name: "foundersTeaser"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Small label — English", name: "founders_eyebrow_en", widget: "string", hint: "e.g. 'Meet the three of us'." }
              - { label: "Small label — Portuguese", name: "founders_eyebrow_pt", widget: "string" }
              - { label: "Headline line 1 — English", name: "founders_h2Line1_en", widget: "string", hint: "e.g. 'A friendship,'." }
              - { label: "Headline line 1 — Portuguese", name: "founders_h2Line1_pt", widget: "string" }
              - { label: "Headline line 2 (italic) — English", name: "founders_h2Line2_en", widget: "string", hint: "e.g. 'a Camino, a home.'." }
              - { label: "Headline line 2 (italic) — Portuguese", name: "founders_h2Line2_pt", widget: "string" }
              - { label: "Intro paragraph — English", name: "founders_body_en", widget: "text" }
              - { label: "Intro paragraph — Portuguese", name: "founders_body_pt", widget: "text" }
              - { label: "Read-full-story link — English", name: "founders_ctaMore_en", widget: "string", hint: "e.g. 'Read the full story'." }
              - { label: "Read-full-story link — Portuguese", name: "founders_ctaMore_pt", widget: "string" }

          # ---- CTA (bottom of many pages) ----
          - label: "9. Bottom call-to-action band (WhatsApp / Email — also used on About & Experiences pages)"
            name: "cta"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Small label — English", name: "cta_eyebrow_en", widget: "string", required: false }
              - { label: "Small label — Portuguese", name: "cta_eyebrow_pt", widget: "string", required: false }
              - { label: "Big headline — English", name: "cta_h2_en", widget: "string", hint: "e.g. \"Drop us a note and let's start planning.\"" }
              - { label: "Big headline — Portuguese", name: "cta_h2_pt", widget: "string" }
