          - { label: "Tagline (Portuguese)", name: "tagline_pt", widget: "string" }
          - { label: "Chip 1 (English)", name: "chip1_en", widget: "string" }
          - { label: "Chip 1 (Portuguese)", name: "chip1_pt", widget: "string" }
          - { label: "Chip 2 (English)", name: "chip2_en", widget: "string" }
          - { label: "Chip 2 (Portuguese)", name: "chip2_pt", widget: "string" }
          - { label: "Chip 3 (English)", name: "chip3_en", widget: "string" }
          - { label: "Chip 3 (Portuguese)", name: "chip3_pt", widget: "string" }
          - { label: "Column heading — Explore (English)", name: "colExplore_en", widget: "string" }
          - { label: "Column heading — Explore (Portuguese)", name: "colExplore_pt", widget: "string" }
          - { label: "Column heading — Experiences (English)", name: "colExperiences_en", widget: "string" }
          - { label: "Column heading — Experiences (Portuguese)", name: "colExperiences_pt", widget: "string" }
          - { label: "Column heading — Contact (English)", name: "colContact_en", widget: "string" }
          - { label: "Column heading — Contact (Portuguese)", name: "colContact_pt", widget: "string" }
          - { label: "Rights prefix (English)", name: "rightsPrefix_en", widget: "string" }
          - { label: "Rights prefix (Portuguese)", name: "rightsPrefix_pt", widget: "string" }
          - { label: "Rights suffix (English)", name: "rightsSuffix_en", widget: "string" }
          - { label: "Rights suffix (Portuguese)", name: "rightsSuffix_pt", widget: "string" }
          - { label: "Obrigado line (English)", name: "obrigado_en", widget: "string" }
          - { label: "Obrigado line (Portuguese)", name: "obrigado_pt", widget: "string" }
          - { label: "TripAdvisor link text (English)", name: "tripadvisorLinkText_en", widget: "string" }
          - { label: "TripAdvisor link text (Portuguese)", name: "tripadvisorLinkText_pt", widget: "string" }

      - name: "home"
        label: "Home page copy"
        file: "src/content/pages/home.yml"
        fields:
          # Hero
          - { label: "Hero eyebrow (English)", name: "hero_eyebrow_en", widget: "string" }
          - { label: "Hero eyebrow (Portuguese)", name: "hero_eyebrow_pt", widget: "string" }
          - { label: "Hero headline line 1 (English)", name: "hero_line1_en", widget: "string" }
          - { label: "Hero headline line 1 (Portuguese)", name: "hero_line1_pt", widget: "string" }
          - { label: "Hero headline line 2 (English)", name: "hero_line2_en", widget: "string" }
          - { label: "Hero headline line 2 (Portuguese)", name: "hero_line2_pt", widget: "string" }
          - { label: "Hero headline line 3 (English)", name: "hero_line3_en", widget: "string" }
          - { label: "Hero headline line 3 (Portuguese)", name: "hero_line3_pt", widget: "string" }
