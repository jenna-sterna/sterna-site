          - { label: "CTA WhatsApp label (English)", name: "cta_whatsapp_en", widget: "string" }
          - { label: "CTA WhatsApp label (Portuguese)", name: "cta_whatsapp_pt", widget: "string" }
          - { label: "CTA Email label (English)", name: "cta_email_en", widget: "string" }
          - { label: "CTA Email label (Portuguese)", name: "cta_email_pt", widget: "string" }

      - name: "about"
        label: "About page copy"
        file: "src/content/pages/about.yml"
        fields:
          - { label: "Eyebrow (English)", name: "eyebrow_en", widget: "string" }
          - { label: "Eyebrow (Portuguese)", name: "eyebrow_pt", widget: "string" }
