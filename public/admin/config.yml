          - { label: "H1 line 1 (Portuguese)", name: "h1Line1_pt", widget: "string" }
          - { label: "H1 line 2 (English)", name: "h1Line2_en", widget: "string" }
          - { label: "H1 line 2 (Portuguese)", name: "h1Line2_pt", widget: "string" }
          - { label: "Lead (English)", name: "lead_en", widget: "markdown" }
          - { label: "Lead (Portuguese)", name: "lead_pt", widget: "markdown" }
