# Sveltia CMS configuration for Sterna Aveiro Tours
#
# Uses GitHub OAuth for authentication (Netlify Identity is deprecated for
# new sites). Editors sign in with their GitHub account and must be
# collaborators on the Bduncs2/sterna-site repo.
#
# For local development, run `npx @sveltia/cms-proxy-server` in a second
# terminal and open http://localhost:4321/admin/ — writes to disk directly.

backend:
  name: github
  repo: Bduncs2/sterna-site
  branch: main
  base_url: https://sveltia-cms-auth.braidenduncan1.workers.dev

local_backend: true

media_folder: "public/uploads"
public_folder: "/uploads"

site_url: https://sterna.pt
display_url: https://sterna.pt
logo_url: /favicon.svg

collections:
  # ==========================================================
  # EXPERIENCES (existing — do not refactor)
  # ==========================================================
  - name: "experiences"
    label: "Experiences"
    label_singular: "Experience"
    folder: "src/content/experiences"
    format: "yaml-frontmatter"
    create: true
    slug: "{{slug}}"
    identifier_field: nameEn
    summary: "{{nameEn}} — {{durationEn}}"
    sortable_fields: ["order", "featured", "nameEn"]
    fields:
      - { label: "URL slug (no spaces, lowercase, dashes only)", name: "slug", widget: "string", hint: "Used in the page URL. Do not change once published." }
      - { label: "Display order", name: "order", widget: "number", value_type: "int", min: 1, hint: "Lower numbers appear first." }
      - { label: "Featured on homepage?", name: "featured", widget: "boolean", default: false, hint: "If yes, this experience appears in the homepage 'core 6' section." }
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - { label: "Food & Wine", value: "food-wine" }
          - { label: "Nature & Water", value: "nature-water" }
          - { label: "Culture", value: "culture" }
          - { label: "Wellness", value: "wellness" }

      # --- English content ---
      - { label: "Category label (EN)", name: "categoryLabelEn", widget: "string" }
      - { label: "Name (EN)", name: "nameEn", widget: "string" }
      - { label: "Short tagline (EN)", name: "shortEn", widget: "string", hint: "One short line shown on cards." }
      - { label: "One-liner description (EN)", name: "oneLinerEn", widget: "text" }
      - { label: "Duration (EN)", name: "durationEn", widget: "string", hint: "e.g. '4 hours', '5-6 hours', 'Half day'." }
      - label: "What's included (EN)"
        name: "includedEn"
        widget: "list"
        default: []
        field: { label: "Item", name: "item", widget: "string" }
      - label: "Optional add-ons (EN)"
        name: "addOnsEn"
        widget: "list"
        required: false
        field: { label: "Add-on", name: "item", widget: "string" }
      - { label: "Price note (EN)", name: "priceNoteEn", widget: "text" }

      # --- Portuguese content ---
      - { label: "Category label (PT)", name: "categoryLabelPt", widget: "string" }
      - { label: "Nome (PT)", name: "namePt", widget: "string" }
      - { label: "Tagline curta (PT)", name: "shortPt", widget: "string" }
      - { label: "Descrição (PT)", name: "oneLinerPt", widget: "text" }
      - { label: "Duração (PT)", name: "durationPt", widget: "string" }
      - label: "O que está incluído (PT)"
        name: "includedPt"
        widget: "list"
        default: []
        field: { label: "Item", name: "item", widget: "string" }
      - label: "Extras opcionais (PT)"
        name: "addOnsPt"
        widget: "list"
        required: false
        field: { label: "Extra", name: "item", widget: "string" }
      - { label: "Nota de preço (PT)", name: "priceNotePt", widget: "text" }

      # --- Media ---
      - { label: "Main photo", name: "heroPhoto", widget: "image", required: false, hint: "Landscape photo, 2000-3000px wide. Upload or pick from library." }
      - label: "Gallery (extra photos)"
        name: "gallery"
        widget: "list"
        required: false
        field: { label: "Photo", name: "photo", widget: "image" }

  # ==========================================================
  # FOUNDERS (Jenna, Carlos, Sandra)
  # ==========================================================
  - name: "founders"
    label: "Founders"
    label_singular: "Founder"
    folder: "src/content/founders"
    format: "yaml-frontmatter"
    create: true
    slug: "{{slug}}"
    identifier_field: nameEn
    summary: "{{nameEn}} — {{roleEn}}"
    sortable_fields: ["order", "nameEn"]
    fields:
      - { label: "Display order", name: "order", widget: "number", value_type: "int", min: 1 }
      - { label: "URL slug (lowercase, no spaces)", name: "slug", widget: "string" }
      - { label: "Name (English)", name: "nameEn", widget: "string" }
      - { label: "Name (Portuguese)", name: "namePt", widget: "string" }
      - { label: "Role (English)", name: "roleEn", widget: "string" }
      - { label: "Role (Portuguese)", name: "rolePt", widget: "string" }
      - { label: "Origin / background (English)", name: "originEn", widget: "string", hint: "Short one-line origin note, e.g. 'USA → Aveiro, 2025'." }
      - { label: "Origin / background (Portuguese)", name: "originPt", widget: "string" }
      - { label: "Bio line (English)", name: "lineEn", widget: "text" }
      - { label: "Bio line (Portuguese)", name: "linePt", widget: "text" }
      - { label: "Photo", name: "photo", widget: "image", required: false }

  # ==========================================================
  # FAQs (one entry per Q&A pair)
  # ==========================================================
  - name: "faqs"
    label: "FAQs"
    label_singular: "FAQ"
    folder: "src/content/faqs"
    format: "yaml-frontmatter"
    create: true
    slug: "{{order}}-{{slug}}"
    identifier_field: questionEn
    summary: "{{order}} · {{questionEn}}"
    sortable_fields: ["order", "questionEn"]
    fields:
      - { label: "Display order", name: "order", widget: "number", value_type: "int", min: 1 }
      - { label: "Question (English)", name: "questionEn", widget: "string" }
      - { label: "Question (Portuguese)", name: "questionPt", widget: "string" }
      - { label: "Answer (English)", name: "answerEn", widget: "markdown" }
      - { label: "Answer (Portuguese)", name: "answerPt", widget: "markdown" }

  # ==========================================================
  # REVIEWS (real TripAdvisor / Google reviews)
  # ==========================================================
  - name: "reviews"
    label: "Reviews"
    label_singular: "Review"
    folder: "src/content/reviews"
    format: "yaml-frontmatter"
    create: true
    slug: "{{order}}-{{slug}}"
    identifier_field: authorName
    summary: "{{order}} · {{authorName}}"
    sortable_fields: ["order", "authorName"]
    fields:
      - { label: "Display order", name: "order", widget: "number", value_type: "int", min: 1 }
      - { label: "Reviewer name", name: "authorName", widget: "string" }
      - { label: "Meta (city and/or date)", name: "authorMeta", widget: "string", hint: "e.g. 'London, UK · September 2025' or just 'September 2025'." }
      - { label: "Star rating (1-5)", name: "rating", widget: "number", value_type: "int", min: 1, max: 5, default: 5 }
      - { label: "Quote (English)", name: "quoteEn", widget: "markdown" }
      - { label: "Quote (Portuguese)", name: "quotePt", widget: "markdown" }

  # ==========================================================
  # SITE SETTINGS (company info, trust badges)
  # ==========================================================
  - name: "settings"
    label: "Site settings"
    editor: { preview: false }
    files:
      - name: "company"
        label: "Company / contact info"
        file: "src/content/settings/company.yml"
        fields:
          - { label: "Company name", name: "name", widget: "string" }
          - { label: "Short name", name: "shortName", widget: "string" }
          - { label: "Phone (display)", name: "phone", widget: "string" }
          - { label: "Phone link (tel:...)", name: "phoneHref", widget: "string" }
          - { label: "WhatsApp (display)", name: "whatsapp", widget: "string" }
          - { label: "WhatsApp link (https://wa.me/...)", name: "whatsappHref", widget: "string" }
          - { label: "Email address", name: "email", widget: "string" }
          - { label: "Email link (mailto:...)", name: "emailHref", widget: "string" }
          - { label: "Instagram handle", name: "instagramHandle", widget: "string" }
          - { label: "Instagram URL", name: "instagramUrl", widget: "string" }
          - { label: "TripAdvisor URL", name: "tripadvisorUrl", widget: "string" }
          - { label: "Review count (e.g. 300+)", name: "reviewCount", widget: "string" }
          - { label: "Year established", name: "established", widget: "number", value_type: "int" }
          - { label: "Address — city", name: "addressCity", widget: "string" }
          - { label: "Address — region", name: "addressRegion", widget: "string" }
          - { label: "Address — country", name: "addressCountry", widget: "string" }
          - { label: "Max group size", name: "maxGroupSize", widget: "number", value_type: "int" }

      - name: "trust"
        label: "Trust badges"
        file: "src/content/settings/trust.yml"
        fields:
          - label: "Badges"
            name: "badges"
            widget: "list"
            fields:
              - { label: "Badge (English)", name: "en", widget: "string" }
              - { label: "Badge (Portuguese)", name: "pt", widget: "string" }

  # ==========================================================
  # PAGE COPY (site-wide + per-page strings)
  # Each entry is one page's worth of copy.
  # EN and PT variants are separate fields with _en / _pt suffix.
  # ==========================================================
  - name: "pages"
    label: "Page content"
    editor: { preview: false }
    files:
      - name: "meta"
        label: "Meta / SEO defaults"
        file: "src/content/pages/meta.yml"
        fields:
          - { label: "Title suffix (English)", name: "titleSuffix_en", widget: "string", hint: "Appended to every page title, e.g. '· Sterna Aveiro Experiences'." }
          - { label: "Title suffix (Portuguese)", name: "titleSuffix_pt", widget: "string" }
          - { label: "Default page title (English)", name: "defaultTitle_en", widget: "string" }
          - { label: "Default page title (Portuguese)", name: "defaultTitle_pt", widget: "string" }
          - { label: "Default meta description (English)", name: "defaultDescription_en", widget: "text" }
          - { label: "Default meta description (Portuguese)", name: "defaultDescription_pt", widget: "text" }

      - name: "nav"
        label: "Navigation labels"
        file: "src/content/pages/nav.yml"
        fields:
          - { label: "Home (English)", name: "home_en", widget: "string" }
          - { label: "Home (Portuguese)", name: "home_pt", widget: "string" }
          - { label: "Experiences (English)", name: "experiences_en", widget: "string" }
          - { label: "Experiences (Portuguese)", name: "experiences_pt", widget: "string" }
          - { label: "About (English)", name: "about_en", widget: "string" }
          - { label: "About (Portuguese)", name: "about_pt", widget: "string" }
          - { label: "FAQ (English)", name: "faq_en", widget: "string" }
          - { label: "FAQ (Portuguese)", name: "faq_pt", widget: "string" }
          - { label: "Contact (English)", name: "contact_en", widget: "string" }
          - { label: "Contact (Portuguese)", name: "contact_pt", widget: "string" }
          - { label: "Plan-your-trip CTA (English)", name: "plan_en", widget: "string" }
          - { label: "Plan-your-trip CTA (Portuguese)", name: "plan_pt", widget: "string" }
          - { label: "WhatsApp button label (English)", name: "whatsapp_en", widget: "string" }
          - { label: "WhatsApp button label (Portuguese)", name: "whatsapp_pt", widget: "string" }
          - { label: "Language toggle label (English mode)", name: "langLabel_en", widget: "string" }
          - { label: "Language toggle label (Portuguese mode)", name: "langLabel_pt", widget: "string" }
          - { label: "Language toggle aria-label (English mode)", name: "langAriaLabel_en", widget: "string" }
          - { label: "Language toggle aria-label (Portuguese mode)", name: "langAriaLabel_pt", widget: "string" }

      - name: "footer"
