          - { label: "Hero scroll label (English)", name: "hero_scroll_en", widget: "string" }
          - { label: "Hero scroll label (Portuguese)", name: "hero_scroll_pt", widget: "string" }

          # Intro
          - { label: "Intro caption (English)", name: "intro_caption_en", widget: "string" }
          - { label: "Intro caption (Portuguese)", name: "intro_caption_pt", widget: "string" }
