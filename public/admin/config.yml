          - { label: "Founders teaser CTA (Portuguese)", name: "founders_ctaMore_pt", widget: "string" }

          # CTA band
          - { label: "CTA eyebrow (English)", name: "cta_eyebrow_en", widget: "string" }
          - { label: "CTA eyebrow (Portuguese)", name: "cta_eyebrow_pt", widget: "string" }
          - { label: "CTA h2 (English)", name: "cta_h2_en", widget: "string" }
          - { label: "CTA h2 (Portuguese)", name: "cta_h2_pt", widget: "string" }
          - { label: "CTA lead (English)", name: "cta_lead_en", widget: "markdown" }
          - { label: "CTA lead (Portuguese)", name: "cta_lead_pt", widget: "markdown" }
          - { label: "CTA obrigado (English)", name: "cta_obrigado_en", widget: "string" }
